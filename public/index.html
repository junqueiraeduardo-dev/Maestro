<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>VoiceParts AI</title>
  <style>
    /* Dark Mode: não cansa os olhos no ambiente de oficina */
    :root { --bg:#0b0f14; --fg:#e8eef5; --muted:#7c8a99; --accent:#0aa37a; --accent2:#0c7; --err:#e0524b; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 28px; padding: 24px; text-align: center;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin: 0; letter-spacing: .5px; }
    h1 small { display:block; color: var(--muted); font-weight: 400; font-size: .8rem; margin-top:6px; }

    /* Botão de microfone GIGANTE - alvo fácil, inclusive com luvas */
    #mic {
      width: min(62vw, 260px); height: min(62vw, 260px);
      border-radius: 50%; border: none; cursor: pointer;
      background: radial-gradient(circle at 50% 40%, var(--accent2), var(--accent));
      color: #03110c; font-size: 1.4rem; font-weight: 700;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; transition: transform .08s ease, box-shadow .2s ease;
      box-shadow: 0 0 0 0 rgba(12,200,160,.5); user-select: none;
    }
    #mic:active { transform: scale(.97); }
    #mic[data-state="listening"] {
      background: radial-gradient(circle at 50% 40%, #ff5e57, var(--err));
      color: #2a0a08; animation: pulse 1.2s infinite;
    }
    #mic[data-state="thinking"] { filter: grayscale(.4) brightness(.8); cursor: progress; }
    #mic .ico { font-size: 3.4rem; line-height: 1; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(224,82,75,.55); }
      70%  { box-shadow: 0 0 0 26px rgba(224,82,75,0); }
      100% { box-shadow: 0 0 0 0 rgba(224,82,75,0); }
    }

    #status { min-height: 2.4em; font-size: 1.15rem; color: var(--fg); max-width: 520px; }
    #status.err { color: var(--err); }
    #hint { color: var(--muted); font-size: .85rem; max-width: 480px; }
    .unsupported { color: var(--err); font-size: 1rem; max-width: 420px; }
  </style>
</head>
<body>
  <h1>VoiceParts AI <small>assistente de estoque por voz</small></h1>

  <button id="mic" data-state="idle" aria-label="Pressione para falar">
    <span class="ico" aria-hidden="true">🎤</span>
    <span id="micLabel">Falar</span>
  </button>

  <div id="status" role="status" aria-live="polite">Toque no microfone e fale.</div>
  <div id="hint">Ex.: “onde está o filtro de óleo” · “tira 2 óleo 5w30” · “monta o kit de troca de óleo”</div>

  <script src="/app.js"></script>
</body>
</html>
