<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
  <meta name="theme-color" content="#0E1117"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="apple-touch-icon" href="/favicon.svg"/>
  <title>Maestro · Manutenção por voz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0E1117; overscroll-behavior: none;
    }
    body { font-family: 'Inter', system-ui, sans-serif; color: #F1F5F9; }
    #root { height: 100%; width: 100%; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    button { font-family: inherit; }
    input { font-family: inherit; }
    /* tela de carregamento enquanto o Babel compila os .jsx no cliente */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #0E1117; z-index: 9999;
    }
    #boot .mono {
      width: 72px; height: 72px; border-radius: 10px; background: #F59E0B;
      padding: 18px 13px; display: flex; align-items: center;
      justify-content: space-between; gap: 4px;
    }
    #boot .mono i {
      flex: 1; background: #0E1117; border-radius: 2px; transform-origin: center;
      animation: bwave 1.1s ease-in-out infinite;
    }
    #boot .mono i:nth-child(1) { height: 30%;  animation-delay: 0s;    }
    #boot .mono i:nth-child(2) { height: 100%; animation-delay: .18s;  }
    #boot .mono i:nth-child(3) { height: 55%;  animation-delay: .36s;  }
    #boot .mono i:nth-child(4) { height: 100%; animation-delay: .54s;  }
    #boot .mono i:nth-child(5) { height: 30%;  animation-delay: .72s;  }
    #boot .word {
      font-weight: 800; letter-spacing: 2px; color: #F1F5F9; font-size: 15px;
    }
    @keyframes bwave { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.35); } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mono"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="word">MAESTRO</div>
  </div>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
